<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pick the chant</title>
<style>
  body{margin:0;min-height:100dvh;background:#1b4d2b;color:#fff;font:600 18px/1.35 -apple-system,system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;box-sizing:border-box;text-align:center}
  h1{margin:0 0 6px;color:#FFC62F;font-size:28px;letter-spacing:.5px}
  p{margin:0;opacity:.85;font-weight:500;font-size:16px}
  button{width:min(420px,100%);padding:18px 16px;border:3px solid #FFC62F;border-radius:16px;background:#0f3a1f;color:#fff;
    font:inherit;cursor:pointer;display:flex;align-items:center;gap:14px;text-align:left}
  button b{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:#FFC62F;color:#0f3a1f;display:grid;place-items:center;font-size:22px}
  button small{display:block;font-weight:500;opacity:.8;font-size:14px}
  button.on{background:#FFC62F;color:#0f3a1f}
  button.on b{background:#0f3a1f;color:#FFC62F}
</style>
</head>
<body>
<h1>Which "PACKERS!" chant?</h1>
<p>Tap to hear "1-2-3 PACKERS!" Turn the ringer on.</p>
<button data-v="a"><b>A</b><span>Stadium crowd<small>Big and echoey, the whole crowd yells</small></span></button>
<button data-v="b"><b>B</b><span>Coach counts, team yells<small>One voice counts, everyone answers PACKERS</small></span></button>
<button data-v="c"><b>C</b><span>Team huddle (live now)<small>Tight and close, the players chant together</small></span></button>
<p>Tell Claude the letter you like.</p>
<script>
  const audios = {};
  document.querySelectorAll("button").forEach(b => {
    const v = b.dataset.v, a = new Audio(v + ".mp3?v=1"); a.preload = "auto"; audios[v] = a;
    b.addEventListener("click", () => {
      Object.values(audios).forEach(x => { x.pause(); x.currentTime = 0; });
      document.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      a.play().catch(() => {});
      a.onended = () => b.classList.remove("on");
    });
  });
</script>
</body>
</html>
